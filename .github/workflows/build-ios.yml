name: Build iOS app

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find Xcode project or workspace
        id: project
        shell: bash
        run: |
          set -euo pipefail

          workspace=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          project=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          if [ -n "$workspace" ]; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$workspace" >> "$GITHUB_OUTPUT"
          elif [ -n "$project" ]; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$project" >> "$GITHUB_OUTPUT"
          else
            echo "No .xcworkspace or .xcodeproj found in repository."
            exit 1
          fi

      - name: Detect first shared scheme
        id: scheme
        shell: bash
        run: |
          set -euo pipefail

          TARGET_PATH="${{ steps.project.outputs.path }}"
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild -list -json -workspace "$TARGET_PATH" > xcode-list.json
          else
            xcodebuild -list -json -project "$TARGET_PATH" > xcode-list.json
          fi

          python3 - <<'PY'
          import json
          with open('xcode-list.json') as f:
              data = json.load(f)

          schemes = []
          if 'workspace' in data:
              schemes = data['workspace'].get('schemes', [])
          elif 'project' in data:
              schemes = data['project'].get('schemes', [])

          if not schemes:
              raise SystemExit('No shared scheme found. Please share a scheme in Xcode.')

          with open('/tmp/detected_scheme', 'w') as f:
              f.write(schemes[0])
          print(schemes[0])
          PY

          echo "name=$(cat /tmp/detected_scheme)" >> "$GITHUB_OUTPUT"

      - name: Build iOS app for Simulator
        shell: bash
        run: |
          set -euo pipefail

          TARGET_PATH="${{ steps.project.outputs.path }}"
          SCHEME="${{ steps.scheme.outputs.name }}"

          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild \
              -workspace "$TARGET_PATH" \
              -scheme "$SCHEME" \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 15' \
              clean build
          else
            xcodebuild \
              -project "$TARGET_PATH" \
              -scheme "$SCHEME" \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 15' \
              clean build
          fi
