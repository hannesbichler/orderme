name: Build iOS app

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Set iOS minimum deployment target
        run: |
          sed -i '' "s/platform :ios, '.*'/platform :ios, '13.0'/" ios/Podfile || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (no codesign)
        run: flutter build ipa --release --no-codesign

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" Payload/
          zip -r Runner.ipa Payload
          echo "IPA created: $(du -sh Runner.ipa | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: Runner.ipa
